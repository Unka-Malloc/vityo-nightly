name: audit

on:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Vityo nightly
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up standardized Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13.5"

      - name: Supply chain governance gate
        run: python3 scripts/supply-chain-governance-gate.py

      - name: Dependency policy gate
        run: python3 scripts/dependency-policy-gate.py

      - name: GitHub Actions pin gate (enforce)
        run: python3 scripts/github-actions-pin-gate.py --mode enforce

      - name: Security baseline gate
        run: python3 scripts/check_security_baseline.py

      - name: License policy gate
        run: python3 scripts/check_license_policy.py

      - name: Architecture boundary gate
        run: python3 scripts/check_architecture_boundaries.py

      - name: Product-line boundary gate
        run: python3 scripts/check_product_line_boundaries.py
