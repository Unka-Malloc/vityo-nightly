[workspace]
resolver = "2"
members = [
  "crates/vityod",
  "crates/vityod-agent-host",
  "crates/vityod-kernel",
  "crates/vityod-platform",
  "crates/vityod-protocol",
  "crates/vityod-runtime",
  "crates/vityod-workspace",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
libc = "0.2"
portable-pty = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
