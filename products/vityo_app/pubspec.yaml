name: vityo_app
description: Vityo, the agent-native IDE for Styio across desktop, web, and mobile.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.11.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  pty2: 0.5.2
  cryptography: ^2.9.0
  web: ^1.1.1
  vityo_agent_protocol:
    path: ../../packages/vityo_agent_protocol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.26.0

flutter:
  uses-material-design: true
  assets:
    - assets/module_manifests/
    - assets/capability_matrices/

# pty2 declares its lint preset as a runtime dependency. It is not imported by
# the package at runtime, so keep Vityo's independently gated lint baseline.
dependency_overrides:
  lints: 5.1.1
