name: vityo_app
description: Vityo, the agent-native IDE for Styio across desktop, web, and mobile.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.11.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  ffi: ^2.2.0
  flutter_secure_storage: ^11.0.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  cryptography: ^2.9.0
  web: ^1.1.1
  vityo_agent_protocol:
    path: ../../packages/vityo_agent_protocol
  vityo_daemon_protocol:
    path: ../../packages/vityo_daemon_protocol

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.26.0
  vm_service: ^15.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/module_manifests/
    - assets/capability_matrices/
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    - family: Azeret Mono
      fonts:
        - asset: assets/fonts/AzeretMono-400.ttf
          weight: 400
        - asset: assets/fonts/AzeretMono-500.ttf
          weight: 500
        - asset: assets/fonts/AzeretMono-600.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/plex/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/plex/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/plex/IBMPlexMono-SemiBold.ttf
          weight: 600
    - family: IBM Plex Sans Condensed
      fonts:
        - asset: assets/fonts/plex/IBMPlexSansCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plex/IBMPlexSansCondensed-Bold.ttf
          weight: 700

dependency_overrides:
  lints: 5.1.1
