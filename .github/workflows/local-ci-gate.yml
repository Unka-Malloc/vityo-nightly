        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vityo-coverage-reports-macos
          path: |
            vityo-nightly/.coverage
            vityo-nightly/frontend/vityo_app/coverage/lcov.info
          if-no-files-found: ignore
