name: styio-audit

on:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: styio-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITYO_PYTHON_VERSION: "3.13.5"

    steps:
      - name: Checkout Vityo nightly
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
          path: vityo-nightly

      - name: Checkout released styio-audit policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          repository: SymPolicy/styio-audit
          ref: stable
          path: styio-audit

      - name: Set up standardized Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ env.VITYO_PYTHON_VERSION }}

      - name: Fetch managed branch evidence
        working-directory: vityo-nightly
        run: |
          for branch in release stable nightly; do
            git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          done

      - name: Run released styio-audit gate
        working-directory: vityo-nightly
        run: |
          git -C ../styio-audit rev-parse HEAD
          python3 ../styio-audit/bin/styio-audit gate --repo . --project Vityo
