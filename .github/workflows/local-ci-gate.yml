name: local-ci-gate

on:
  schedule:
    - cron: "37 18 * * *"
  pull_request:
  push:
    branches:
      - nightly
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-ci-gate:
    name: local-ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHON_BIN: python3
      VITYO_PYTHON_VERSION: "3.13.5"
      VITYO_NODE_VERSION: "24.15.0"
      VITYO_FLUTTER_VERSION: "3.41.7"

    steps:
      - name: Checkout Vityo nightly
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
          path: vityo-nightly

      - name: Resolve fixed product matrix
        id: product-matrix
        shell: bash
        working-directory: vityo-nightly
        run: |
          "$PYTHON_BIN" - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          matrix = json.loads(Path("toolchain/product-matrix.json").read_text(encoding="utf-8"))
          repositories = matrix.get("repositories", {})
          for name in ("styio", "pafio"):
              commit = repositories.get(name, "")
              if not re.fullmatch(r"[0-9a-f]{40}", commit):
                  raise SystemExit(f"invalid fixed {name} commit")
              print(f"{name}={commit}")
          PY

      - name: Checkout Styio sibling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          repository: Unka-Malloc/styio-nightly
          ref: ${{ steps.product-matrix.outputs.styio }}
          path: styio-nightly

      - name: Checkout Pafio sibling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          repository: Unka-Malloc/pafio-nightly
          ref: ${{ steps.product-matrix.outputs.pafio }}
          path: pafio-nightly

      - name: Set up standardized Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ env.VITYO_PYTHON_VERSION }}

      - name: Set up standardized Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.VITYO_NODE_VERSION }}

      - name: Set up standardized Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: ${{ env.VITYO_FLUTTER_VERSION }}

      - name: Set up MSVC command environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
        with:
          arch: x64

      - name: Install CI Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd  # v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libclang-rt-18-dev lld-18 llvm-18-dev

      - name: Verify standardized Linux toolchain
        run: |
          "$PYTHON_BIN" --version | grep -F "${VITYO_PYTHON_VERSION}"
          node --version | grep -F "v${VITYO_NODE_VERSION}"
          npm --version
          flutter --version | grep -m1 '^Flutter ' | grep -F "${VITYO_FLUTTER_VERSION}"
          flutter config --enable-web --enable-linux-desktop
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version

      - name: Restore repository dependencies
        working-directory: vityo-nightly
        run: |
          "$PYTHON_BIN" -m pip install coverage
          ./scripts/bootstrap-workspace.sh --platforms web,linux

      - name: Build Styio language fixture parser
        working-directory: styio-nightly
        run: |
          cmake -S . -B build/default -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build build/default --target styio --config Debug -j2

      - name: Resolve Styio executable
        id: styio-bin
        shell: bash
        working-directory: styio-nightly
        run: |
          styio_path="$(find build/default -type f \( -name styio -o -name styio.exe \) | head -n 1)"
          if [[ -z "$styio_path" ]]; then
            echo "No built styio executable found under build/default." >&2
            exit 1
          fi
          absolute_path="$PWD/$styio_path"
          if command -v cygpath >/dev/null 2>&1; then
            absolute_path="$(cygpath -m "$absolute_path")"
          fi
          "$absolute_path" --version || true
          echo "path=$absolute_path" >> "$GITHUB_OUTPUT"

      - name: Build real Pafio CLI
        working-directory: pafio-nightly
        run: |
          cmake -S . -B build/default -DCMAKE_BUILD_TYPE=Release -DSPIO_BUILD_TESTS=OFF
          cmake --build build/default --target spio --config Release -j2

      - name: Resolve Pafio executable
        id: pafio-bin
        shell: bash
        working-directory: pafio-nightly
        run: |
          pafio_path="$(find build/default -type f \( -name spio -o -name spio.exe \) | head -n 1)"
          if [[ -z "$pafio_path" ]]; then
            echo "No built Pafio executable found under build/default." >&2
            exit 1
          fi
          absolute_path="$PWD/$pafio_path"
          if command -v cygpath >/dev/null 2>&1; then
            absolute_path="$(cygpath -m "$absolute_path")"
          fi
          "$absolute_path" --version
          echo "path=$absolute_path" >> "$GITHUB_OUTPUT"

      - name: Resolve CI refs
        id: ci_refs
        shell: bash
        working-directory: vityo-nightly
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
            BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE_REF="HEAD^"
              RANGE="HEAD^..HEAD"
            else
              BASE_REF="HEAD"
              RANGE="HEAD"
            fi
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE_REF="HEAD^"
            else
              BASE_REF="HEAD"
            fi
            RANGE="HEAD"
          else
            BASE_REF="${{ github.event.before }}"
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi

          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "range=${RANGE}" >> "$GITHUB_OUTPUT"

      - name: Run Vityo nightly Linux CI gate
        working-directory: vityo-nightly
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
          VITYO_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          STYIO: ${{ steps.styio-bin.outputs.path }}
          VITYO_PRODUCT_PLATFORM: linux
          VITYO_PRODUCT_STYIO_BIN: ${{ steps.styio-bin.outputs.path }}
          VITYO_PRODUCT_PAFIO_BIN: ${{ steps.pafio-bin.outputs.path }}
          VITYO_PRODUCT_GATE_OUTPUT: build/evidence/product-gate-linux.json
        run: >
          bash scripts/delivery-gate.sh
          --mode push
          --base "${{ steps.ci_refs.outputs.base_ref }}"
          --range "${{ steps.ci_refs.outputs.range }}"
          --skip-audit

      - name: Validate pinned Linux developer-loop report
        working-directory: vityo-nightly
        run: dart run tests/acceptance/vityo_app/trusted_desktop_styio_loop_acceptance_test.dart --report build/evidence/product-gate-linux.json --platform linux

      - name: Build native Linux release target
        working-directory: vityo-nightly/products/vityo_app
        run: flutter build linux --release

      - name: Prove native Linux PTY matrix
        working-directory: vityo-nightly
        run: >
          "$PYTHON_BIN" scripts/run-native-pty-matrix.py
          --platform linux
          --output build/evidence/native-pty-linux.json

      - name: vityo-linux-package-smoke
        working-directory: vityo-nightly
        run: |
          "$PYTHON_BIN" scripts/package-nightly.py --platform linux
          artifact="$(find build/nightly -maxdepth 1 -name 'vityo-nightly-linux-*.deb' -print -quit)"
          test -n "$artifact"
          dpkg-deb --info "$artifact"
          sudo dpkg -i "$artifact"
          mkdir -p build/nightly/smoke-workspace
          printf 'styio delivery smoke\n' >build/nightly/smoke-workspace/main.styio
          commit="$(git rev-parse HEAD)"
          source_fingerprint="$("$PYTHON_BIN" scripts/vityo_quality.py \
            --product ide --suite source-fingerprint)"
          xvfb-run -a vityo --vityo-delivery-smoke \
            --workspace build/nightly/smoke-workspace \
            --evidence build/nightly/linux-delivery.json \
            --commit "$commit" \
            --source-fingerprint "$source_fingerprint"
          "$PYTHON_BIN" packaging/vityo/desktop_delivery.py \
            --repo-root . --platform linux \
            --evidence build/nightly/linux-delivery.json

      - name: Record pinned Linux product matrix evidence
        working-directory: vityo-nightly
        run: >
          "$PYTHON_BIN" scripts/record-product-matrix-evidence.py
          --platform linux
          --vityo .
          --styio ../styio-nightly
          --pafio ../pafio-nightly
          --matrix toolchain/product-matrix.json
          --gate-report build/evidence/product-gate-linux.json
          --pty-report build/evidence/native-pty-linux.json
          --output build/evidence/product-matrix-linux.json

      - name: Upload Linux coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: vityo-coverage-reports-linux
          path: |
            vityo-nightly/.coverage
            vityo-nightly/products/vityo_app/coverage/lcov.info
            vityo-nightly/build/evidence/product-gate-linux.json
            vityo-nightly/build/evidence/native-pty-linux.json
            vityo-nightly/build/evidence/product-matrix-linux.json
          if-no-files-found: ignore

      - name: Upload Linux Nightly package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: vityo-nightly-linux
          path: vityo-nightly/build/nightly
          if-no-files-found: error

  windows-native:
    name: windows-native
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PYTHON_BIN: python
      VITYO_PYTHON_VERSION: "3.13.5"
      VITYO_NODE_VERSION: "24.15.0"
      VITYO_FLUTTER_VERSION: "3.41.7"

    steps:
      - name: Checkout Vityo nightly
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
          path: vityo-nightly

      - name: Resolve fixed product matrix
        id: product-matrix
        shell: bash
        working-directory: vityo-nightly
        run: |
          "$PYTHON_BIN" - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          matrix = json.loads(Path("toolchain/product-matrix.json").read_text(encoding="utf-8"))
          repositories = matrix.get("repositories", {})
          for name in ("styio", "pafio"):
              commit = repositories.get(name, "")
              if not re.fullmatch(r"[0-9a-f]{40}", commit):
                  raise SystemExit(f"invalid fixed {name} commit")
              print(f"{name}={commit}")
          PY

      - name: Checkout Styio sibling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          repository: Unka-Malloc/styio-nightly
          ref: ${{ steps.product-matrix.outputs.styio }}
          path: styio-nightly

      - name: Checkout Pafio sibling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          repository: Unka-Malloc/pafio-nightly
          ref: ${{ steps.product-matrix.outputs.pafio }}
          path: pafio-nightly

      - name: Set up standardized Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ env.VITYO_PYTHON_VERSION }}

      - name: Set up standardized Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.VITYO_NODE_VERSION }}

      - name: Set up standardized Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: ${{ env.VITYO_FLUTTER_VERSION }}

      - name: Install CI Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd  # v2
        with:
          chrome-version: stable

      - name: Install CMake, Ninja, and LLVM 18 development package
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462  # v2
        with:
          environment-name: styio-llvm18
          cache-environment: true
          create-args: >-
            cmake
            ninja
            llvm=18.1.8
            llvmdev=18.1.8
            clang-tools=18.1.8
            zlib
            libxml2
            zstd

      - name: Locate LLVM 18
        shell: pwsh
        run: |
          $condaPrefix = Join-Path $env:MAMBA_ROOT_PREFIX "envs\styio-llvm18"
          if (!(Test-Path $condaPrefix) -and $env:CONDA_PREFIX) {
            $condaPrefix = $env:CONDA_PREFIX
          }
          if (!(Test-Path $condaPrefix)) {
            throw "micromamba environment was not found"
          }

          $llvmRoot = Join-Path $condaPrefix "Library"
          $llvmConfig = Join-Path $llvmRoot "lib\cmake\llvm\LLVMConfig.cmake"
          if (!(Test-Path $llvmConfig)) {
            throw "LLVMConfig.cmake was not found in $llvmRoot"
          }

          $llvmDir = Split-Path -Parent $llvmConfig

          Add-Content $env:GITHUB_PATH (Join-Path $llvmRoot "bin")
          Add-Content $env:GITHUB_PATH (Join-Path $condaPrefix "Scripts")
          Add-Content $env:GITHUB_ENV "LLVM_DIR=$llvmDir"
          Add-Content $env:GITHUB_ENV "STYIO_NATIVE_TOOLCHAIN_ROOT=$llvmRoot"

          $diaLib = Get-ChildItem -Path (Join-Path $env:ProgramFiles "Microsoft Visual Studio") -Recurse -Filter diaguids.lib -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*\DIA SDK\lib\amd64\diaguids.lib" } |
            Select-Object -First 1
          if (!$diaLib) {
            throw "MSVC DIA SDK diaguids.lib was not found"
          }
          $vsInstallDir = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $diaLib.FullName)))
          Add-Content $env:GITHUB_ENV "VSINSTALLDIR=$vsInstallDir"

      - name: Verify standardized Windows toolchain
        shell: pwsh
        run: |
          $pythonVersion = python --version
          if ($pythonVersion -notlike "*$env:VITYO_PYTHON_VERSION*") { throw "Unexpected Python version: $pythonVersion" }
          $nodeVersion = node --version
          if ($nodeVersion -ne "v$env:VITYO_NODE_VERSION") { throw "Unexpected Node.js version: $nodeVersion" }
          npm --version
          $flutterVersionOutput = flutter --version
          $flutterVersion = ($flutterVersionOutput -split "`r?`n" | Where-Object { $_ -like "Flutter *" } | Select-Object -First 1)
          if (!$flutterVersion) { throw "Flutter version line not found: $flutterVersionOutput" }
          if ($flutterVersion -notlike "*$env:VITYO_FLUTTER_VERSION*") { throw "Unexpected Flutter version: $flutterVersion" }
          flutter config --enable-web --enable-windows-desktop
          & "${{ steps.setup-chrome.outputs.chrome-path }}" --version

      - name: Restore repository dependencies
        shell: pwsh
        working-directory: vityo-nightly
        run: |
          python -m pip install coverage
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\bootstrap-workspace.ps1 -Platforms web,windows

      - name: Build Styio language fixture parser
        shell: pwsh
        working-directory: styio-nightly
        run: |
          cmake -S . -B build/default -DCMAKE_BUILD_TYPE=Debug -DLLVM_DIR="$env:LLVM_DIR" -DSTYIO_NATIVE_TOOLCHAIN_ROOT="$env:STYIO_NATIVE_TOOLCHAIN_ROOT" -DSTYIO_NATIVE_TOOLCHAIN_MODE=auto
          cmake --build build/default --target styio --config Debug -j2

      - name: Resolve Styio executable
        id: styio-bin
        shell: bash
        working-directory: styio-nightly
        run: |
          styio_path="$(find build/default -type f \( -name styio -o -name styio.exe \) | head -n 1)"
          if [[ -z "$styio_path" ]]; then
            echo "No built styio executable found under build/default." >&2
            exit 1
          fi
          absolute_path="$PWD/$styio_path"
          if command -v cygpath >/dev/null 2>&1; then
            absolute_path="$(cygpath -m "$absolute_path")"
          fi
          "$absolute_path" --version || true
          echo "path=$absolute_path" >> "$GITHUB_OUTPUT"

      - name: Build real Pafio CLI
        working-directory: pafio-nightly
        run: |
          cmake -S . -B build/default -DCMAKE_BUILD_TYPE=Release -DSPIO_BUILD_TESTS=OFF
          cmake --build build/default --target spio --config Release -j2

      - name: Resolve Pafio executable
        id: pafio-bin
        shell: bash
        working-directory: pafio-nightly
        run: |
          pafio_path="$(find build/default -type f \( -name spio -o -name spio.exe \) | head -n 1)"
          if [[ -z "$pafio_path" ]]; then
            echo "No built Pafio executable found under build/default." >&2
            exit 1
          fi
          absolute_path="$PWD/$pafio_path"
          if command -v cygpath >/dev/null 2>&1; then
            absolute_path="$(cygpath -m "$absolute_path")"
          fi
          "$absolute_path" --version
          echo "path=$absolute_path" >> "$GITHUB_OUTPUT"

      - name: Resolve CI refs
        id: ci_refs
        shell: bash
        working-directory: vityo-nightly
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
            BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE_REF="HEAD^"
              RANGE="HEAD^..HEAD"
            else
              BASE_REF="HEAD"
              RANGE="HEAD"
            fi
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE_REF="HEAD^"
            else
              BASE_REF="HEAD"
            fi
            RANGE="HEAD"
          else
            BASE_REF="${{ github.event.before }}"
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi

          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "range=${RANGE}" >> "$GITHUB_OUTPUT"

      - name: Run Vityo nightly Windows CI gate
        shell: bash
        working-directory: vityo-nightly
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
          VITYO_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          STYIO: ${{ steps.styio-bin.outputs.path }}
          VITYO_PRODUCT_PLATFORM: windows
          VITYO_PRODUCT_STYIO_BIN: ${{ steps.styio-bin.outputs.path }}
          VITYO_PRODUCT_PAFIO_BIN: ${{ steps.pafio-bin.outputs.path }}
          VITYO_PRODUCT_GATE_OUTPUT: build/evidence/product-gate-windows.json
        run: >
          bash scripts/delivery-gate.sh
          --mode push
          --base "${{ steps.ci_refs.outputs.base_ref }}"
          --range "${{ steps.ci_refs.outputs.range }}"
          --skip-audit

      - name: Validate pinned Windows developer-loop report
        shell: bash
        working-directory: vityo-nightly
        run: dart run tests/acceptance/vityo_app/trusted_desktop_styio_loop_acceptance_test.dart --report build/evidence/product-gate-windows.json --platform windows

      - name: Build native Windows release target
        shell: pwsh
        working-directory: vityo-nightly\products\vityo_app
        run: flutter build windows --release

      - name: Prove native Windows PTY matrix
        shell: pwsh
        working-directory: vityo-nightly
        run: >
          python scripts/run-native-pty-matrix.py
          --platform windows
          --output build/evidence/native-pty-windows.json

      - name: vityo-windows-package-smoke
        shell: pwsh
        working-directory: vityo-nightly
        run: |
          python scripts/package-nightly.py --platform windows
          $artifact = Get-ChildItem build/nightly/vityo-nightly-windows-*.zip | Select-Object -First 1
          if (!$artifact) { throw "Windows Nightly archive was not created" }
          $extractRoot = Join-Path $env:RUNNER_TEMP "vityo-nightly-package"
          $installRoot = Join-Path $env:RUNNER_TEMP "vityo-nightly-installed"
          Expand-Archive -LiteralPath $artifact.FullName -DestinationPath $extractRoot -Force
          $packageRoot = Join-Path $extractRoot "Vityo-Nightly"
          & (Join-Path $packageRoot "install.ps1") -Source $packageRoot -Destination $installRoot
          $smokeWorkspace = Join-Path $env:RUNNER_TEMP "vityo-smoke-workspace"
          New-Item -ItemType Directory -Force -Path $smokeWorkspace | Out-Null
          Set-Content -LiteralPath (Join-Path $smokeWorkspace "main.styio") -Value "styio delivery smoke"
          $evidence = Join-Path $PWD "build/nightly/windows-delivery.json"
          $commit = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $sourceFingerprint = (python scripts/vityo_quality.py --product ide --suite source-fingerprint).Trim()
          $process = Start-Process -FilePath (Join-Path $installRoot "vityo_app.exe") -ArgumentList @("--vityo-delivery-smoke", "--workspace", $smokeWorkspace, "--evidence", $evidence, "--commit", $commit, "--source-fingerprint", $sourceFingerprint) -WorkingDirectory $installRoot -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installed Windows Nightly smoke failed with code $($process.ExitCode)" }
          python packaging/vityo/desktop_delivery.py --repo-root . --platform windows --evidence $evidence
          & (Join-Path $packageRoot "uninstall.ps1") -Destination $installRoot

      - name: Record pinned Windows product matrix evidence
        shell: bash
        working-directory: vityo-nightly
        run: >
          "$PYTHON_BIN" scripts/record-product-matrix-evidence.py
          --platform windows
          --vityo .
          --styio ../styio-nightly
          --pafio ../pafio-nightly
          --matrix toolchain/product-matrix.json
          --gate-report build/evidence/product-gate-windows.json
          --pty-report build/evidence/native-pty-windows.json
          --output build/evidence/product-matrix-windows.json

      - name: Upload Windows coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: vityo-coverage-reports-windows
          path: |
            vityo-nightly/.coverage
            vityo-nightly/products/vityo_app/coverage/lcov.info
            vityo-nightly/build/evidence/product-gate-windows.json
            vityo-nightly/build/evidence/native-pty-windows.json
            vityo-nightly/build/evidence/product-matrix-windows.json
          if-no-files-found: ignore

      - name: Upload Windows Nightly package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: vityo-nightly-windows
          path: vityo-nightly/build/nightly
          if-no-files-found: error

  macos-native:
    name: macos-native
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      PYTHON_BIN: python3
      VITYO_PYTHON_VERSION: "3.13.5"
      VITYO_NODE_VERSION: "24.15.0"
      VITYO_FLUTTER_VERSION: "3.41.7"

    steps:
      - name: Checkout Vityo nightly
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
          path: vityo-nightly

      - name: Resolve fixed product matrix
        id: product-matrix
        shell: bash
        working-directory: vityo-nightly
        run: |
          "$PYTHON_BIN" - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          matrix = json.loads(Path("toolchain/product-matrix.json").read_text(encoding="utf-8"))
          repositories = matrix.get("repositories", {})
          for name in ("styio", "pafio"):
              commit = repositories.get(name, "")
              if not re.fullmatch(r"[0-9a-f]{40}", commit):
                  raise SystemExit(f"invalid fixed {name} commit")
              print(f"{name}={commit}")
          PY

      - name: Checkout Styio sibling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          repository: Unka-Malloc/styio-nightly
          ref: ${{ steps.product-matrix.outputs.styio }}
          path: styio-nightly

      - name: Checkout Pafio sibling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          repository: Unka-Malloc/pafio-nightly
          ref: ${{ steps.product-matrix.outputs.pafio }}
          path: pafio-nightly

      - name: Set up standardized Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ env.VITYO_PYTHON_VERSION }}

      - name: Set up standardized Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.VITYO_NODE_VERSION }}

      - name: Set up standardized Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: ${{ env.VITYO_FLUTTER_VERSION }}

      - name: Install CI Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd  # v2
        with:
          chrome-version: stable

      - name: Install macOS LLVM
        run: |
          brew install llvm@18
          echo "LLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"

      - name: Verify standardized macOS toolchain
        run: |
          "$PYTHON_BIN" --version | grep -F "${VITYO_PYTHON_VERSION}"
          node --version | grep -F "v${VITYO_NODE_VERSION}"
          npm --version
          flutter --version | grep -m1 '^Flutter ' | grep -F "${VITYO_FLUTTER_VERSION}"
          flutter config --enable-web --enable-macos-desktop
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version

      - name: Restore repository dependencies
        working-directory: vityo-nightly
        run: |
          "$PYTHON_BIN" -m pip install coverage
          ./scripts/bootstrap-workspace.sh --platforms web,macos

      - name: Build Styio language fixture parser
        working-directory: styio-nightly
        run: |
          cmake -S . -B build/default -DCMAKE_BUILD_TYPE=Debug -DLLVM_DIR="$LLVM_DIR"
          cmake --build build/default --target styio --config Debug -j2

      - name: Resolve Styio executable
        id: styio-bin
        shell: bash
        working-directory: styio-nightly
        run: |
          styio_path="$(find build/default -type f \( -name styio -o -name styio.exe \) | head -n 1)"
          if [[ -z "$styio_path" ]]; then
            echo "No built styio executable found under build/default." >&2
            exit 1
          fi
          absolute_path="$PWD/$styio_path"
          if command -v cygpath >/dev/null 2>&1; then
            absolute_path="$(cygpath -m "$absolute_path")"
          fi
          "$absolute_path" --version || true
          echo "path=$absolute_path" >> "$GITHUB_OUTPUT"

      - name: Build real Pafio CLI
        working-directory: pafio-nightly
        run: |
          cmake -S . -B build/default -DCMAKE_BUILD_TYPE=Release -DSPIO_BUILD_TESTS=OFF
          cmake --build build/default --target spio --config Release -j2

      - name: Resolve Pafio executable
        id: pafio-bin
        shell: bash
        working-directory: pafio-nightly
        run: |
          pafio_path="$(find build/default -type f \( -name spio -o -name spio.exe \) | head -n 1)"
          if [[ -z "$pafio_path" ]]; then
            echo "No built Pafio executable found under build/default." >&2
            exit 1
          fi
          absolute_path="$PWD/$pafio_path"
          if command -v cygpath >/dev/null 2>&1; then
            absolute_path="$(cygpath -m "$absolute_path")"
          fi
          "$absolute_path" --version
          echo "path=$absolute_path" >> "$GITHUB_OUTPUT"

      - name: Resolve CI refs
        id: ci_refs
        shell: bash
        working-directory: vityo-nightly
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
            BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE_REF="HEAD^"
              RANGE="HEAD^..HEAD"
            else
              BASE_REF="HEAD"
              RANGE="HEAD"
            fi
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE_REF="HEAD^"
            else
              BASE_REF="HEAD"
            fi
            RANGE="HEAD"
          else
            BASE_REF="${{ github.event.before }}"
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi

          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "range=${RANGE}" >> "$GITHUB_OUTPUT"

      - name: Run Vityo nightly macOS CI gate
        working-directory: vityo-nightly
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
          VITYO_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          STYIO: ${{ steps.styio-bin.outputs.path }}
          VITYO_PRODUCT_PLATFORM: macos
          VITYO_PRODUCT_STYIO_BIN: ${{ steps.styio-bin.outputs.path }}
          VITYO_PRODUCT_PAFIO_BIN: ${{ steps.pafio-bin.outputs.path }}
          VITYO_PRODUCT_GATE_OUTPUT: build/evidence/product-gate-macos.json
        run: >
          bash scripts/delivery-gate.sh
          --mode push
          --base "${{ steps.ci_refs.outputs.base_ref }}"
          --range "${{ steps.ci_refs.outputs.range }}"
          --skip-audit

      - name: Validate pinned macOS developer-loop report
        working-directory: vityo-nightly
        run: dart run tests/acceptance/vityo_app/trusted_desktop_styio_loop_acceptance_test.dart --report build/evidence/product-gate-macos.json --platform macos

      - name: Build native macOS release target
        working-directory: vityo-nightly/products/vityo_app
        run: flutter build macos --release

      - name: Prove native macOS PTY matrix
        working-directory: vityo-nightly
        run: >
          "$PYTHON_BIN" scripts/run-native-pty-matrix.py
          --platform macos
          --output build/evidence/native-pty-macos.json

      - name: vityo-macos-package-smoke
        working-directory: vityo-nightly
        run: |
          "$PYTHON_BIN" scripts/package-nightly.py --platform macos
          artifact="$(find build/nightly -maxdepth 1 -name 'vityo-nightly-macos-*.dmg' -print -quit)"
          test -n "$artifact"
          hdiutil verify "$artifact"
          mount_dir="$(mktemp -d)"
          install_dir="$(mktemp -d)"
          hdiutil attach "$artifact" -nobrowse -readonly -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rm -rf "$mount_dir" "$install_dir"' EXIT
          cp -R "$mount_dir/Vityo Nightly.app" "$install_dir/Vityo Nightly.app"
          mkdir -p build/nightly/smoke-workspace
          printf 'styio delivery smoke\n' >build/nightly/smoke-workspace/main.styio
          commit="$(git rev-parse HEAD)"
          source_fingerprint="$("$PYTHON_BIN" scripts/vityo_quality.py \
            --product ide --suite source-fingerprint)"
          "$install_dir/Vityo Nightly.app/Contents/MacOS/Vityo" \
            --vityo-delivery-smoke \
            --workspace build/nightly/smoke-workspace \
            --evidence build/nightly/macos-delivery.json \
            --commit "$commit" \
            --source-fingerprint "$source_fingerprint"
          "$PYTHON_BIN" packaging/vityo/desktop_delivery.py \
            --repo-root . --platform macos \
            --evidence build/nightly/macos-delivery.json
          hdiutil detach "$mount_dir"
          trap - EXIT
          rm -rf "$mount_dir" "$install_dir"

      - name: Record pinned macOS product matrix evidence
        working-directory: vityo-nightly
        run: >
          "$PYTHON_BIN" scripts/record-product-matrix-evidence.py
          --platform macos
          --vityo .
          --styio ../styio-nightly
          --pafio ../pafio-nightly
          --matrix toolchain/product-matrix.json
          --gate-report build/evidence/product-gate-macos.json
          --pty-report build/evidence/native-pty-macos.json
          --output build/evidence/product-matrix-macos.json

      - name: Upload macOS coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: vityo-coverage-reports-macos
          path: |
            vityo-nightly/.coverage
            vityo-nightly/products/vityo_app/coverage/lcov.info
            vityo-nightly/build/evidence/product-gate-macos.json
            vityo-nightly/build/evidence/native-pty-macos.json
            vityo-nightly/build/evidence/product-matrix-macos.json
          if-no-files-found: ignore

      - name: Upload macOS Nightly package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: vityo-nightly-macos
          path: vityo-nightly/build/nightly
          if-no-files-found: error
