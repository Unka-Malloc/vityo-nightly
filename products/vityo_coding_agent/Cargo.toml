[package]
name = "vityo-coding-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
description = "Standalone, model-neutral Vityo Coding Agent runtime"

[lib]
name = "vityo_coding_agent"
path = "src/lib.rs"

[[bin]]
name = "vityo-coding-agent"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { version = "=2.2.0", default-features = false }
async-openai = { version = "=0.42.1", default-features = false, features = ["chat-completion", "rustls"] }
async-trait = "0.1.89"
futures = "0.3.32"
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-child-process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.52", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
